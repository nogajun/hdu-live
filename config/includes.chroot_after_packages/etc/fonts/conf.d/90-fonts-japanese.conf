<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- langがja かつ フォントがserif の場合 → Noto Serif CJK JP を優先選択 -->
  <match target="pattern">
    <test name="lang" qual="any" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" qual="any" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <!-- langがja かつ フォントがsans-serif の場合 → Noto Sans CJK JP を優先選択 -->
  <match target="pattern">
    <test name="lang" qual="any" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" qual="any" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <!-- langがja かつ フォントがmonospace の場合 → Noto Sans Mono CJK JP を優先選択 -->
  <match target="pattern">
    <test name="lang" qual="any" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" qual="any" compare="eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- フォント名が MS Gothic の場合 → BIZ UDGothic を優先選択 -->
  <alias>
    <family>MS Gothic</family>
    <prefer>
      <family>BIZ UDGothic</family>
    </prefer>
  </alias>

  <!-- フォント名が MS PGothic の場合 → BIZ UDPGothic を優先選択 -->
  <alias>
    <family>MS PGothic</family>
    <prefer>
      <family>BIZ UDPGothic</family>
    </prefer>
  </alias>

  <!-- フォント名が ＭＳ ゴシック の場合 → BIZ UDGothic を優先選択 -->
  <alias>
    <family>ＭＳ　ゴシック</family>
    <prefer>
      <family>BIZ UDGothic</family>
    </prefer>
  </alias>

  <!-- フォント名が ＭＳ Ｐゴシック の場合 → BIZ UDPGothic を優先選択 -->
  <alias>
    <family>ＭＳ　Ｐゴシック</family>
    <prefer>
      <family>BIZ UDPGothic</family>
    </prefer>
  </alias>

  <!-- フォント名が MS Mincho の場合 → BIZ UDMincho を優先選択 -->
  <alias>
    <family>MS Mincho</family>
    <prefer>
      <family>BIZ UDMincho</family>
    </prefer>
  </alias>

  <!-- フォント名が MS PMincho の場合 → BIZ PUDMincho を優先選択 -->
  <alias>
    <family>MS PMincho</family>
    <prefer>
      <family>BIZ UDPMincho</family>
    </prefer>
  </alias>

  <!-- フォント名が ＭＳ 明朝 の場合 → BIZ UDMincho を優先選択 -->
  <alias>
    <family>ＭＳ　明朝</family>
    <prefer>
      <family>BIZ UDMincho</family>
    </prefer>
  </alias>

  <!-- フォント名が ＭＳ Ｐ明朝 の場合 → BIZ PUDMincho を優先選択 -->
  <alias>
    <family>ＭＳ　Ｐ明朝</family>
    <prefer>
      <family>BIZ UDPMincho</family>
    </prefer>
  </alias>

  <!-- フォント名が Meiryo の場合 → M PLUS 1 Medium を優先選択 -->
  <alias>
    <family>Meiryo</family>
    <prefer>
      <family>M PLUS 1</family>
    </prefer>
  </alias>

  <!-- フォント名が メイリオ の場合 → M PLUS 1 Medium を優先選択 -->
  <alias>
    <family>メイリオ</family>
    <prefer>
      <family>M PLUS 1</family>
    </prefer>
  </alias>

  <!-- フォント名が Yu Mincho の場合 → Note Serif CJK JP を優先選択 -->
  <alias>
    <family>Yu Mincho</family>
    <prefer>
      <family>Note Serif CJK JP</family>
    </prefer>
  </alias>

  <!-- フォント名が Yu Mincho Demibold の場合 → Note Serif CJK JP Medium を優先選択 -->
  <alias>
    <family>Yu Mincho Demibold</family>
    <prefer>
      <family>Noto Serif CJK JP Medium</family>
    </prefer>
  </alias>

  <!-- フォント名が Yu Mincho Light の場合 → Note Serif CJK JP Light を優先選択 -->
  <alias>
    <family>Yu Mincho Light</family>
    <prefer>
      <family>Noto Serif CJK JP Light</family>
    </prefer>
  </alias>

  <!-- フォント名が 游明朝 の場合 → Note Serif CJK JP を優先選択 -->
  <alias>
    <family>游明朝</family>
    <prefer>
      <family>Note Serif CJK JP</family>
    </prefer>
  </alias>

  <!-- フォント名が 游明朝 Demibold の場合 → Note Serif CJK JP Medium を優先選択 -->
  <alias>
    <family>游明朝 Demibold</family>
    <prefer>
      <family>Noto Serif CJK JP Medium</family>
    </prefer>
  </alias>

  <!-- フォント名が 游明朝 Light の場合 → Note Serif CJK JP Light を優先選択 -->
  <alias>
    <family>游明朝 Light</family>
    <prefer>
      <family>Noto Serif CJK JP Light</family>
    </prefer>
  </alias>

  <!-- フォント名が Yu Gothic の場合 → Note Sans CJK JP を優先選択 -->
  <alias>
    <family>Yu Gothic</family>
    <prefer>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <!-- フォント名が Yu Gothic Medium の場合 → Note Sans CJK JP Medium を優先選択 -->
  <alias>
    <family>Yu Gothic Medium</family>
    <prefer>
      <family>Noto Sans CJK JP Medium</family>
    </prefer>
  </alias>

  <!-- フォント名が Yu Gothic Light の場合 → Note Sans CJK JP Light を優先選択 -->
  <alias>
    <family>Yu Gothic Light</family>
    <prefer>
      <family>Noto Sans CJK JP Light</family>
    </prefer>
  </alias>

  <!-- フォント名が 游ゴシック の場合 → Note Sans CJK JP を優先選択 -->
  <alias>
    <family>游ゴシック</family>
    <prefer>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <!-- フォント名が 游ゴシック Medium の場合 → Note Sans CJK JP Medium を優先選択 -->
  <alias>
    <family>游ゴシック Medium</family>
    <prefer>
      <family>Noto Sans CJK JP Medium</family>
    </prefer>
  </alias>

  <!-- フォント名が 游ゴシック Light の場合 → Note Sans CJK JP Light を優先選択 -->
  <alias>
    <family>游ゴシック Light</family>
    <prefer>
      <family>Noto Sans CJK JP Light</family>
    </prefer>
  </alias>

</fontconfig>

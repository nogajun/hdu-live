<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit mode="prepend" name="family">
      <string>Noto Serif CJK JP</string>
      <string>BIZ UDPMincho</string>
      <string>BIZ UDMincho</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit mode="prepend" name="family">
      <string>Noto Sans CJK JP</string>
      <string>IBM Plex Sans JP</string>
      <string>M PLUS 1</string>
      <string>M PLUS 2</string>
      <string>BIZ UDPGothic</string>
      <string>BIZ UDGothic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family">
      <string>mono</string>
    </test>
    <edit mode="prepend" name="family">
      <string>M PLUS 1 Code</string>
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="font">
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hinting">
      <bool>false</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintnone</const>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
